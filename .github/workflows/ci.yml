name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        # 'min' resolves to the lowest Julia allowed by [compat] in Project.toml (currently 1.9).
        # 'lts' is the long-term-support release, '1.12' is the version agents use locally,
        # and '1' is the latest stable release.
        version: ['min', 'lts', '1.12', '1']
    permissions:
      actions: write
      contents: read
    # Julia 1.9's bundled libopenlibm.so requests an executable stack, which the
    # newer glibc on ubuntu-latest refuses to load ("cannot enable executable
    # stack ... Invalid argument"), so `julia --version` dies before any test
    # runs. Run the compat-floor job on ubuntu-22.04 (older glibc) so 1.9 is
    # still genuinely tested; every other version stays on ubuntu-latest.
    runs-on: ${{ matrix.version == 'min' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@9353db09a0f2bbbdec6f41791918c75d37391b36 # v3.5.0
      - uses: julia-actions/julia-buildpkg@e3eb439fad4f9aba7da2667e7510e4a46ebc46e1 # v1.7.0
      - uses: julia-actions/julia-runtest@6e050c8013b833b1195105ff2fce9cd802f53271 # v1.12.0
      - uses: julia-actions/julia-processcoverage@03114f09f119417c3242a9fb6e0b722676aedf38 # v1.2.2
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
