name: Documentation

on:
  push:
    branches:
      - main
    tags: '*'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

# Owner approval for this workflow file: LIM-231 / GH#25 (Documenter deploy AC).
# PR review of this PR records acceptance of the .github/workflows change.

jobs:
  # Pull requests: build-only, read-only, no deployment secrets.
  build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build documentation
        run: julia --color=yes --project=docs docs/make.jl
        env:
          # No deploy auth on PRs — make.jl only runs makedocs.
          GITHUB_TOKEN: ""
          DOCUMENTER_KEY: ""
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  # Push to main/tags: full deploy with write permissions.
  # Documenter uses GITHUB_TOKEN by default (same-repo Pages); DOCUMENTER_KEY is optional SSH key.
  deploy:
    if: github.event_name == 'push'
    # Permissions needed to:
    # - Deploy docs: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    # Documenter pushes gh-pages via GITHUB_TOKEN; no actions/deploy-pages.
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
        with:
          version: '1.12'
      - uses: julia-actions/cache@e32267b41e0fa7df82a3d53e8c7273620d52c586 # v3.4.0
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional; leave unset for GITHUB_TOKEN-only deploy (Documenter supports either).
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
